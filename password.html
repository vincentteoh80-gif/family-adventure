<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>修改游戏密码</title>
<style>body{font-family:system-ui,"Microsoft YaHei",sans-serif;max-width:640px;margin:30px auto;padding:0 16px;line-height:1.6}
input,button{font-size:18px;padding:8px 12px}textarea{width:100%;height:130px;font-family:monospace;font-size:14px}</style></head>
<body>
<h2>修改游戏密码</h2>
<p>1. 输入新密码，点“生成”。<br>2. 把下面生成的内容整个复制，替换 <b>config.js</b> 的全部内容。<br>3. 上传到 GitHub，刷新游戏，用新密码登录。</p>
<input id="p" type="text" placeholder="新密码"> <button id="b">生成</button>
<p><textarea id="o" readonly></textarea></p>
<p style="color:#a00">提示：这个页面在你自己的浏览器里运行，密码不会上传到任何地方。生成后可以把这个 tools 文件夹从 GitHub 删除。</p>
<script>
document.getElementById('b').onclick = async function () {
  const pw = document.getElementById('p').value; if (!pw) return;
  const salt = crypto.getRandomValues(new Uint8Array(16)), it = 120000;
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: it, hash: 'SHA-256' }, k, 256);
  const hex = a => Array.from(new Uint8Array(a)).map(b => b.toString(16).padStart(2, '0')).join('');
  document.getElementById('o').value =
`/* 游戏设置 —— 改密码：打开 tools/password.html，生成新的 salt 和 hash，替换下面两行即可。
   注意：GitHub Pages 是纯静态网站，这个密码只能挡住普通访客，懂技术的人仍可能绕过。 */
window.GAME_CONFIG = {
  salt: '${hex(salt)}',
  hash: '${hex(bits)}',
  iterations: ${it}
};
`;
};
</script>
</body></html>
