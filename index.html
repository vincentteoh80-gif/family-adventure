<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>一家四口的冒险</title>
<meta name="description" content="四个人，一段故事，无数有趣任务。">
<meta name="theme-color" content="#ff9f1c">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="家庭冒险">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="rpg.css">
</head>
<body data-screen="login">

<!-- 登录 -->
<section id="login" class="screen show">
  <div class="card login-card">
    <canvas id="loginArt" width="560" height="200"></canvas>
    <h1>一家四口的冒险</h1>
    <p class="sub">四个人，一段故事，无数有趣任务。</p>
    <form id="loginForm" autocomplete="on">
      <input type="password" id="pw" placeholder="请输入家庭密码" autocomplete="current-password" required>
      <label class="check"><input type="checkbox" id="remember" checked> 在这台设备上记住我</label>
      <button type="submit" class="btn big" id="loginBtn">进入游戏</button>
      <p id="loginMsg" class="msg"></p>
    </form>
  </div>
</section>

<!-- 标题菜单 -->
<section id="title" class="screen">
  <div class="title-wrap">
    <canvas id="titleArt" width="640" height="220"></canvas>
    <h1>一家四口的冒险</h1>
    <p class="sub" id="chapName">第一章：相遇与婚礼（2011 – 2012）</p>
    <div class="title-btns">
      <button class="btn big" id="tContinue">继续冒险</button>
      <button class="btn big" id="tNew">新的冒险</button>
      <a class="btn ghost" href="classic.html">经典闯关小游戏</a>
    </div>
    <div class="title-small">
      <button class="btn small ghost" id="tSound">音效：开</button>
      <button class="btn small ghost" id="tLogout">退出登录</button>
    </div>
    <div class="help">
      <b>电脑：</b>WASD / 方向键 走路，<b>J 或 空格</b> 攻击，<b>K</b> 技能，<b>L 或 Shift</b> 闪避，<b>Q</b> 换人，<b>E 或 Enter</b> 对话，<b>H</b> 吃便当。<br>
      <b>手机：</b>左下角摇杆走路，右下角按钮攻击 / 技能 / 闪避 / 换人。靠近人物时“攻击”键会变成“对话”。<br>
      打怪拿经验升级，升级会变强。黄色箭头指向当前任务。碰到 <b>相框</b> 会存档并回满体力。
    </div>
  </div>
</section>

<!-- 游戏 -->
<section id="play" class="screen">
  <canvas id="cv"></canvas>
  <div id="hudL">
    <div id="party"></div>
    <div class="lvrow"><span id="lv">Lv1</span><i class="xpbar"><i id="xp"></i></i><span class="coin">金币 <b id="coins">0</b></span></div>
  </div>
  <div id="questBox"><span class="qtag">任务</span><span id="questT"></span></div>
  <div id="hudR">
    <button class="ibtn2" id="bBento" title="吃便当">便当 <b id="nBento">0</b></button>
    <button class="ibtn2" id="bEggs" title="番茄炒蛋">番茄炒蛋 <b id="nEggs">0</b></button>
    <button class="ibtn2" id="bMenu">菜单</button>
  </div>
  <div id="bossBar"><span id="bossName"></span><i><i id="bossHp"></i></i></div>
  <div id="areaBanner"></div>
  <div id="toast"></div>

  <div id="dialog">
    <canvas id="dlgFace" width="96" height="96"></canvas>
    <div class="dlg-body">
      <div id="dlgName"></div>
      <div id="dlgText"></div>
      <div id="dlgOpts"></div>
      <div id="dlgNext">点击继续 ▼</div>
    </div>
  </div>

  <div id="touchUI">
    <div id="stick"><div id="knob"></div></div>
    <div id="btns">
      <button class="rb small" id="bSwap">换人</button>
      <button class="rb small" id="bDodge">闪避</button>
      <button class="rb mid" id="bSkill">技能<i id="skillCd"></i></button>
      <button class="rb big" id="bAtk">攻击</button>
    </div>
  </div>

  <div id="ovPause" class="overlay"><div class="card">
    <h2>暂停</h2>
    <p class="story" id="pStats"></p>
    <div class="row">
      <button class="btn big" id="pResume">继续</button>
      <button class="btn ghost" id="pTitle">保存并回主菜单</button>
    </div>
  </div></div>

  <div id="ovEnd" class="overlay"><div class="card">
    <h2>第一章完成！</h2>
    <canvas id="endArt" width="400" height="150"></canvas>
    <p class="story" id="endInfo"></p>
    <div class="row">
      <button class="btn big" id="eTitle">回主菜单</button>
    </div>
  </div></div>
</section>

<div id="rotate">横屏玩更好</div>

<script src="config.js"></script>
<script src="characters.js"></script>
<script src="draw.js"></script>
<script src="draw2.js"></script>
<script src="rpg-data.js"></script>
<script src="rpg-engine.js"></script>
<script src="rpg-draw.js"></script>
<script src="rpg-game.js"></script>
</body>
</html>
